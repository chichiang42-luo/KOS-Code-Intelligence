[project]
name = "kos-code-intelligence"
version = "0.3.1"
description = "Local polyglot code knowledge graph and MCP server for coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "chichiang42-luo" },
]
keywords = ["agent", "code-intelligence", "knowledge-graph", "mcp", "polyglot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "mcp>=2,<3",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-bash>=0.25,<0.26",
  "tree-sitter-c>=0.24,<0.25",
  "tree-sitter-cpp>=0.23,<0.24",
  "tree-sitter-css>=0.25,<0.26",
  "tree-sitter-go>=0.25,<0.26",
  "tree-sitter-java>=0.23,<0.24",
  "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-rust>=0.24,<0.25",
  "tree-sitter-typescript>=0.23,<0.24",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
]
test = [
  "build>=1.2,<2",
  "hatchling>=1.27,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
kos = "kos.cli:main"
kos-mcp = "kos.mcp_server:main"

[project.urls]
Homepage = "https://github.com/chichiang42-luo/KOS-Code-Intelligence"
Repository = "https://github.com/chichiang42-luo/KOS-Code-Intelligence"
Issues = "https://github.com/chichiang42-luo/KOS-Code-Intelligence/issues"
Changelog = "https://github.com/chichiang42-luo/KOS-Code-Intelligence/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["sample_data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
