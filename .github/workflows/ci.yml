name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
      - run: kos eval --repo sample_data/sample_shop --store-root .kos_runs/ci --cases evals/sample_shop.json

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: kos --version
      - run: kos languages --repo sample_data/sample_polyglot
      - run: kos update --repo sample_data/sample_polyglot --store-root .kos_runs/package-smoke
      - run: kos-mcp --help
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
